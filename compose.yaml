services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace
      - ~/.aws:/root/.aws:ro
    env_file:
      - path: .env
        required: false
    environment:
      - AWS_DEFAULT_REGION=${AWS_REGION:-ap-northeast-1}
      - AWS_REGION=${AWS_REGION:-ap-northeast-1}
      - AWS_PAGER=
    ports:
      - "5173:5173"
    working_dir: /workspace
